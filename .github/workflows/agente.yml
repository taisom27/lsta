name: Agente de pisos

on:
  schedule:
    # 08:07 y 20:07 en España (UTC+1/+2): GitHub usa hora UTC.
    - cron: "7 6,18 * * *"
  workflow_dispatch:
    inputs:
      todos:
        description: "Enviar todos los pisos válidos, no solo los nuevos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agente-pisos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar pisos y avisar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IDEALISTA_API_KEY: ${{ secrets.IDEALISTA_API_KEY }}
          IDEALISTA_API_SECRET: ${{ secrets.IDEALISTA_API_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
        run: python -m agente_pisos ${{ inputs.todos && '--todos' || '' }}
      - name: Guardar pisos ya avisados
        run: |
          git config user.name "agente-pisos"
          git config user.email "agente-pisos@users.noreply.github.com"
          git add data/vistos.json data/geocache.json
          git diff --cached --quiet || git commit -m "Actualiza pisos vistos"
          git push
