name: App Android (Grabadora YA)

on:
  push:
    paths:
      - "grabadora-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grabadora-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Descargar el modelo de voz en español (Vosk)
        run: |
          curl -fsSL -o modelo.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q modelo.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-es-0.42 app/src/main/assets/modelo

      - name: Compilar el APK
        run: |
          gradle assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk GrabadoraYA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GrabadoraYA
          path: grabadora-android/GrabadoraYA.apk

      - name: Publicar el APK como descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete grabadora-apk --yes --cleanup-tag || true
          gh release create grabadora-apk GrabadoraYA.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Grabadora YA (app Android)" \
            --notes "APK compilado desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Ábrelo en el móvil para instalarlo."
